# PS188 backend — local stack. No secrets live here; the backend reads them from
# .env.development.local (env_file). The environment: block only overrides what
# must differ inside the Docker network (Mongo reached by service name).
services:
  mongo:
    image: mongo:7
    container_name: ps188-mongo
    restart: unless-stopped
    environment:
      MONGO_INITDB_ROOT_USERNAME: root
      MONGO_INITDB_ROOT_PASSWORD: root
      MONGO_INITDB_DATABASE: ps188
    ports:
      - "27017:27017"
    volumes:
      - ps188_mongo_data:/data/db
      - ./docker/mongo-init.js:/docker-entrypoint-initdb.d/mongo-init.js:ro
    healthcheck:
      test: ["CMD", "mongosh", "--quiet", "--eval", "db.adminCommand('ping').ok"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 20s
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

  backend:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: ps188-backend
    restart: on-failure
    depends_on:
      mongo:
        condition: service_healthy
    ports:
      - "8080:8080"
    env_file:
      - .env.development.local
    environment:
      # Container-network overrides only.
      MONGO_URI: mongodb://ps188_app:ps188_app@mongo:27017/ps188?authSource=ps188
      APP_ENV: development
    volumes:
      # STORAGE_DRIVER=local (default) writes document images to LOCAL_STORAGE_DIR
      # (./data/uploads, resolved inside the container as /app/data/uploads) — keep
      # them across container restarts/rebuilds. Irrelevant when STORAGE_DRIVER=gridfs.
      - ps188_uploads:/app/data/uploads
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

volumes:
  ps188_mongo_data:
  ps188_uploads:
